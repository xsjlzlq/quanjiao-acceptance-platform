<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- 天空柔和渐变 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf7ee"/>
      <stop offset="35%" stop-color="#f2faf4"/>
      <stop offset="70%" stop-color="#fbfdfb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 柔和晨曦阳光光晕 -->
    <radialGradient id="sunGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fffdf5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 远山渐变 -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbe5d5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#dff0e6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b6dcce" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d4edd8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 浅绿农田田垄层次渐变 -->
    <linearGradient id="fieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ddba8"/>
      <stop offset="100%" stop-color="#7ec894"/>
    </linearGradient>
    <linearGradient id="fieldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b5e7be"/>
      <stop offset="100%" stop-color="#91d6a0"/>
    </linearGradient>
    <linearGradient id="fieldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7eed0"/>
      <stop offset="100%" stop-color="#a8e2b7"/>
    </linearGradient>
    <linearGradient id="fieldGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69be82"/>
      <stop offset="100%" stop-color="#8fd2a2"/>
    </linearGradient>
    <linearGradient id="fieldGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#83cd97"/>
      <stop offset="100%" stop-color="#5fae74"/>
    </linearGradient>

    <!-- 水渠/田埂反光渐变 -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f4ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d0eefe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c2e7fb" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1e3cb"/>
      <stop offset="100%" stop-color="#b8d4b0"/>
    </linearGradient>

    <!-- 农田纹理图案 -->
    <pattern id="cropLines1" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#71bc86" stroke-width="1.8" stroke-opacity="0.3"/>
      <line x1="15" y1="0" x2="15" y2="30" stroke="#89cf9c" stroke-width="1.2" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="cropLines2" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#5da973" stroke-width="1.5" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="cropLines3" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#68b47c" stroke-width="1.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- 1. 背景天空 -->
  <rect width="100%" height="100%" fill="url(#skyGrad)"/>

  <!-- 2. 阳光光晕与柔和云彩 -->
  <circle cx="380" cy="240" r="350" fill="url(#sunGlow)"/>
  
  <path d="M 120 180 Q 180 150 250 170 Q 320 130 400 170 Q 480 160 520 190 Q 300 210 120 180 Z" fill="#ffffff" fill-opacity="0.55"/>
  <path d="M 1200 140 Q 1280 110 1380 130 Q 1460 100 1560 140 Q 1640 130 1700 160 Q 1450 180 1200 140 Z" fill="#ffffff" fill-opacity="0.45"/>
  <path d="M 800 220 Q 880 190 980 210 Q 1060 190 1150 220 Q 980 250 800 220 Z" fill="#ffffff" fill-opacity="0.4"/>

  <!-- 3. 远景群山叠翠 (浅青/薄绿) -->
  <path d="M 0 540 Q 300 390 650 470 Q 1000 370 1400 480 Q 1700 410 1920 460 L 1920 1080 L 0 1080 Z" fill="url(#mountainGrad1)"/>
  <path d="M 0 580 Q 380 460 820 530 Q 1250 430 1650 540 Q 1820 500 1920 520 L 1920 1080 L 0 1080 Z" fill="url(#mountainGrad2)"/>

  <!-- 4. 纵深广袤的浅绿田野与梯田板块 -->
  <!-- 远景田块 -->
  <path d="M 0 620 L 600 560 L 1280 610 L 1920 570 L 1920 740 L 1100 780 L 0 690 Z" fill="url(#fieldGrad3)"/>
  <path d="M 0 620 L 600 560 L 1280 610 L 1920 570 L 1920 740 L 1100 780 L 0 690 Z" fill="url(#cropLines1)"/>

  <!-- 中景左侧农田 -->
  <path d="M 0 680 L 720 630 L 890 840 L 0 880 Z" fill="url(#fieldGrad2)"/>
  <path d="M 0 680 L 720 630 L 890 840 L 0 880 Z" fill="url(#cropLines2)"/>

  <!-- 中景中央水稻/麦浪农田 -->
  <path d="M 680 630 L 1420 620 L 1580 860 L 860 850 Z" fill="url(#fieldGrad1)"/>
  <path d="M 680 630 L 1420 620 L 1580 860 L 860 850 Z" fill="url(#cropLines3)"/>

  <!-- 中景右侧农田 -->
  <path d="M 1380 620 L 1920 600 L 1920 890 L 1540 870 Z" fill="url(#fieldGrad3)"/>
  <path d="M 1380 620 L 1920 600 L 1920 890 L 1540 870 Z" fill="url(#cropLines1)"/>

  <!-- 5. 蜿蜒灌溉水渠与田间小道 -->
  <path d="M 700 620 Q 820 740 880 860 Q 940 960 980 1080" fill="none" stroke="url(#waterGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 1400 620 Q 1480 730 1560 870 Q 1640 980 1700 1080" fill="none" stroke="url(#waterGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 0 760 Q 400 750 880 860 Q 1200 870 1920 810" fill="none" stroke="url(#ridgeGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- 6. 前景丰饶茂密的浅绿田块 -->
  <!-- 前景左田块 -->
  <path d="M 0 860 L 870 850 L 960 1080 L 0 1080 Z" fill="url(#fieldGrad4)"/>
  <path d="M 0 860 L 870 850 L 960 1080 L 0 1080 Z" fill="url(#cropLines1)"/>

  <!-- 前景右田块 -->
  <path d="M 870 850 L 1920 830 L 1920 1080 L 960 1080 Z" fill="url(#fieldGrad5)"/>
  <path d="M 870 850 L 1920 830 L 1920 1080 L 960 1080 Z" fill="url(#cropLines2)"/>

  <!-- 7. 生机盎然的田埂绿植点缀 (风吹草低稻香) -->
  <!-- 左下角绿树草木 -->
  <ellipse cx="60" cy="940" rx="35" ry="20" fill="#4d9b62" fill-opacity="0.7"/>
  <ellipse cx="110" cy="950" rx="28" ry="18" fill="#5fb477" fill-opacity="0.8"/>
  <ellipse cx="160" cy="945" rx="30" ry="19" fill="#418b55" fill-opacity="0.7"/>

  <!-- 田埂边的树木剪影 -->
  <g fill="#43935a" fill-opacity="0.8">
    <path d="M 850 790 C 830 760 840 730 860 720 C 880 710 900 730 895 760 C 910 770 900 795 870 800 Z"/>
    <path d="M 885 795 C 875 775 885 750 900 740 C 915 735 930 750 925 770 C 935 780 925 800 900 805 Z"/>
    <path d="M 1520 780 C 1505 755 1515 730 1530 720 C 1545 715 1560 730 1555 755 C 1565 765 1555 785 1535 790 Z"/>
  </g>

  <!-- 8. 空中翱翔的飞鸟剪影 -->
  <g fill="#5c8a6f" fill-opacity="0.5">
    <path d="M 450 260 Q 460 250 470 258 Q 480 250 490 260 Q 470 255 450 260 Z"/>
    <path d="M 490 280 Q 498 272 506 278 Q 514 272 522 280 Q 506 276 490 280 Z"/>
    <path d="M 530 250 Q 536 244 542 248 Q 548 244 554 250 Q 542 247 530 250 Z"/>
  </g>
</svg>
